name: Keep Render Alive

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render
        run: |
          curl -s https://kareem-whatsapp-agent.onrender.com/ | head -c 200
          curl -s "https://kareem-whatsapp-agent.onrender.com/webhook?hub.mode=subscribe&hub.verify_token=my_secret_token&hub.challenge=keepalive" | head -c 50
          echo "Ping done at \09/01/2026 23:57:49"
